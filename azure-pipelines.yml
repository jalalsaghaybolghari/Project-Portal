
trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: sdk
      version: '10.x'

  - script: dotnet restore SecureCadPortal.slnx
    displayName: 'Restore dependencies'

  - script: dotnet build SecureCadPortal.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'


  - script: >
      dotnet test tests/SecureCadPortal.UnitTests/SecureCadPortal.UnitTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --settings coverage.runsettings
      --collect:"XPlat Code Coverage"
      --logger "trx;LogFileName=unit-tests.trx"
      --results-directory "$(Agent.TempDirectory)/TestResults/UnitTests"
    displayName: 'Run unit tests and collect coverage'

  - script: >
      dotnet test tests/SecureCadPortal.IntegrationTests/SecureCadPortal.IntegrationTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --settings coverage.runsettings
      --collect:"XPlat Code Coverage"
      --logger "trx;LogFileName=integration-tests.trx"
      --results-directory "$(Agent.TempDirectory)/TestResults/IntegrationTests"
    displayName: 'Run integration tests and collect coverage'


  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'SecureCadPortal automated tests'

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish code coverage'
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
      pathToSources: '$(Build.SourcesDirectory)'
      failIfCoverageEmpty: true
