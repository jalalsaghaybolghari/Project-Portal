
trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: sdk
      version: '10.x'

  - script: dotnet restore SecureCadPortal.slnx
    displayName: 'Restore dependencies'

  - script: dotnet build SecureCadPortal.slnx --configuration $(buildConfiguration) --no-restore
    displayName: 'Build solution'


  - script: >
      dotnet test tests/SecureCadPortal.UnitTests/SecureCadPortal.UnitTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --settings coverage.runsettings
      --collect:"XPlat Code Coverage"
      --logger "trx;LogFileName=unit-tests.trx"
      --results-directory "$(Agent.TempDirectory)/TestResults/UnitTests"
    displayName: 'Run unit tests and collect coverage'

  - script: >
      dotnet test tests/SecureCadPortal.IntegrationTests/SecureCadPortal.IntegrationTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --settings coverage.runsettings
      --collect:"XPlat Code Coverage"
      --logger "trx;LogFileName=integration-tests.trx"
      --results-directory "$(Agent.TempDirectory)/TestResults/IntegrationTests"
    displayName: 'Run integration tests and collect coverage'


  - script: |
      dotnet tool install --tool-path "$(Agent.TempDirectory)/tools" dotnet-reportgenerator-globaltool

      "$(Agent.TempDirectory)/tools/reportgenerator" \
        "-reports:$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml" \
        "-targetdir:$(Agent.TempDirectory)/CoverageReport" \
        "-reporttypes:TextSummary;Cobertura"

      python3 - <<'PY'
      import re
      import sys
      from pathlib import Path

      summary = Path("$(Agent.TempDirectory)/CoverageReport/Summary.txt")
      if not summary.exists():
          print("##vso[task.logissue type=error]Coverage summary was not generated.")
          sys.exit(1)

      text = summary.read_text()
      match = re.search(r"Line coverage:\s*([\d.]+)%", text)

      if not match:
          print("##vso[task.logissue type=error]Could not read line coverage.")
          print(text)
          sys.exit(1)

      coverage = float(match.group(1))
      threshold = 50.0
      print(f"Line coverage: {coverage:.1f}% (minimum: {threshold:.1f}%)")

      if coverage < threshold:
          print("##vso[task.logissue type=error]Code coverage is below the required threshold.")
          sys.exit(1)

      print("Coverage quality gate passed.")
      PY
    displayName: 'Enforce 50% line coverage'


  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'SecureCadPortal automated tests'

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish code coverage'
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/CoverageReport/Cobertura.xml'
      pathToSources: '$(Build.SourcesDirectory)'
      failIfCoverageEmpty: true
